services:
  - type: web
    name: smartvision-cctv-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: COOKIE_SAME_SITE
        value: none
      - key: STUN_URL
        value: stun:stun.l.google.com:19302
      - key: TURN_URL
        sync: false
      - key: TURN_SECRET
        sync: false
